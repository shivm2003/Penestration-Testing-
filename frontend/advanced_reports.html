<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reports Menu | Cyber Command Center</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <h1>SHIVAM <span>OS</span></h1>
                <div class="brand-subtitle">Intelligence Command Center</div>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item"><span class="nav-icon">⚡</span> Dashboard</a>
                <a href="chains.html" class="nav-item"><span class="nav-icon">⚡</span> Attack Chains</a>
                <a href="ai.html" class="nav-item"><span class="nav-icon">🧠</span> AI Intelligence</a>
                <a href="report.html" class="nav-item"><span class="nav-icon">📊</span> Executive Report</a>
                <a href="advanced_reports.html" class="nav-item active" style="color:var(--accent-purple); border-left-color:var(--accent-purple); background:rgba(176,38,255,0.05);">
                    <span class="nav-icon">📋</span> AI Reports Menu
                </a>
            </nav>
            <div class="history-section">
                <!-- Target Filter -->
                <h3>Filter by Target</h3>
                <select id="target-filter" class="scrollable" style="width:100%; background:rgba(0,0,0,0.5); border:1px solid var(--border-color); padding:10px; border-radius:6px; color:#fff; font-size:0.85rem; outline:none;">
                    <option value="">All Targets</option>
                </select>
                <div style="margin-top:20px;">
                    <h3>Filter by Status</h3>
                    <div style="display:flex; flex-direction:column; gap:6px; margin-top:10px;">
                        <label style="font-size:0.85rem; color:var(--text-secondary); cursor:pointer;">
                            <input type="radio" name="status-filter" value="" checked> All Reports
                        </label>
                        <label style="font-size:0.85rem; color:var(--accent-success); cursor:pointer;">
                            <input type="radio" name="status-filter" value="completed"> ✅ Completed
                        </label>
                        <label style="font-size:0.85rem; color:var(--accent-warning); cursor:pointer;">
                            <input type="radio" name="status-filter" value="generating"> ⏳ Generating
                        </label>
                        <label style="font-size:0.85rem; color:var(--accent-danger); cursor:pointer;">
                            <input type="radio" name="status-filter" value="failed"> ❌ Failed
                        </label>
                        <label style="font-size:0.85rem; color:var(--text-secondary); cursor:pointer;">
                            <input type="radio" name="status-filter" value="none"> — No Report
                        </label>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar glass-panel" style="border-bottom-color:rgba(176,38,255,0.2);">
                <h2 style="color:var(--accent-purple); font-weight:800; letter-spacing:1px;">📋 ADVANCED AI REPORTS MENU</h2>
                <div style="display:flex; gap:10px; align-items:center;">
                    <span id="report-stats" style="color:var(--text-secondary); font-size:0.9rem;"></span>
                    <button class="btn btn-launch" onclick="generateAllPending()" style="padding:8px 16px; font-size:0.8rem;">⚡ Analyze All Pending</button>
                </div>
            </header>

            <div class="dashboard-wrapper">
                <div id="reports-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap:20px;">
                    <div class="empty-state" style="grid-column:1/-1; text-align:center; padding:60px; color:var(--text-secondary);">
                        Loading vulnerabilities...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Report Detail Modal -->
    <div id="detail-modal" style="display:none; position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,0.8); backdrop-filter:blur(6px); align-items:center; justify-content:center;">
        <div class="glass-panel" style="width:min(900px,95vw); max-height:88vh; display:flex; flex-direction:column; border-radius:16px; border-color:rgba(176,38,255,0.3); overflow:hidden;">
            <div style="padding:20px 25px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; background:rgba(176,38,255,0.05);">
                <div>
                    <h2 id="detail-title" style="font-size:1.2rem;"></h2>
                    <div id="detail-meta" style="font-size:0.8rem; color:var(--text-secondary); margin-top:4px;"></div>
                </div>
                <button onclick="closeDetailModal()" style="background:none;border:none;color:var(--text-secondary);font-size:1.8rem;cursor:pointer;">&times;</button>
            </div>
            <div style="flex:1; overflow-y:auto; padding:25px;">
                <div id="detail-report-body" style="white-space:pre-wrap; font-size:0.9rem; line-height:1.8; color:var(--text-secondary);"></div>
            </div>
            <div style="padding:15px 25px; border-top:1px solid rgba(255,255,255,0.08); display:flex; gap:10px;">
                <button id="detail-regen-btn" class="btn" style="background:rgba(176,38,255,0.2);color:var(--accent-purple);border:1px solid var(--accent-purple);" onclick="regenReport()">🔄 Regenerate</button>
                <button class="btn" style="background:rgba(0,230,118,0.1);color:var(--accent-success);border:1px solid var(--accent-success);" onclick="downloadReport()">💾 Download</button>
                <button class="btn" style="background:rgba(255,255,255,0.05);color:var(--text-secondary);" onclick="closeDetailModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="advanced_reports.js"></script>
</body>
</html>
